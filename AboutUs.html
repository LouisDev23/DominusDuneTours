<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us | Dominus Dune Tours</title>
    <meta name="description"
        content="Learn about Dominus Dune Tours, Namibia's premier provider of guided dune tours, sandboarding, and desert adventures. Founded in 2024, committed to sustainable tourism.">
    <meta name="keywords"
        content="Dominus Dune Tours, about us, Namibia tours, guided adventures, sustainable tourism, desert experiences">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
      <link rel="icon" href="Dominus Dune Tours Logo.png" type="image/x-icon">

    <link rel="stylesheet" href="styles.css?v7">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif
        }

        body {
            line-height: 1.6;
            color: #333;
            background-color: #eee
        }

        a {
            text-decoration: none;
            color: inherit
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            color: #6a11cb;
            position: relative
        }

        h2::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            margin: 10px auto 0;
            border-radius: 2px;
            background: #ff66cc
        }

        .about-hero {
            width: 100%;
            padding: 150px 20px 100px 20px;
            background: url("Photos/dominus about.jpg") center/cover no-repeat;
            color: #fff;
            text-align: center;
            box-shadow: inset 0 0 0 2000px rgba(0, 0, 0, 0.25);
            border-bottom: 5px solid #080508
        }

        .about-hero h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6)
        }

        .about-hero p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5)
        }

        section {
            width: 100%;
            padding: 60px 40px;
            margin: 0;
            background: linear-gradient(to bottom right, #5a35ff8c, #e1f5fe)
        }

        .about-grid,
        .services-grid,
        .choose-us-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            width: 100%;
            padding: 0 20px
        }

        .about-card,
        .services-card,
        .choose-us-card {
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #ddd;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform .3s, box-shadow .3s, border .3s
        }

        .about-card:hover,
        .services-card:hover,
        .choose-us-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
            border: 1px solid #6a11cb
        }

        .about-card h3,
        .services-card h3,
        .choose-us-card h3 {
            margin-bottom: 15px;
            color: #2575fc;
            border-bottom: 2px solid #ff66cc;
            padding-bottom: 5px
        }

        @media(max-width:768px) {
            .about-hero h1 {
                font-size: 2.2rem
            }

            section {
                padding: 40px 20px
            }
        }
    </style>

  <script>

</head>
